<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YuE2 Console — Prototype</title>
<style>
  :root{
    --canvas:#191919;
    --surface:#202020;
    --raised:#2b2b29;
    --raised-hover:#383836;
    --text:#ffffff;
    --text-secondary:rgba(255,255,255,0.65);
    --text-tertiary:rgba(255,255,255,0.42);
    --border:rgba(255,255,255,0.14);
    --border-strong:rgba(255,255,255,0.24);
    --blue:#5E9FE8;
    --blue-soft:rgba(94,159,232,0.14);
    --green:#72BC8F;
    --green-soft:rgba(114,188,143,0.14);
    --orange:#DE9255;
    --orange-soft:rgba(222,146,85,0.14);
    --red:#E97366;
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:0 32px 64px;}
  /* Topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:28px;
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5E9FE8,#BF8EDA);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-icon svg{width:16px;height:16px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .brand-title{font-weight:600;font-size:15px;letter-spacing:.1px;}
  .brand-sub{font-size:12px;color:var(--text-tertiary);}
  .topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .vram{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .vram-label{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
  .vram-bar{width:140px;height:6px;border-radius:4px;background:var(--raised);overflow:hidden;position:relative;}
  .vram-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--blue),#72BC8F);border-radius:4px;transition:width .6s ease;}
  .vram-text{font-size:12px;color:var(--text-secondary);white-space:nowrap;min-width:88px;}
  .btn{
    font:inherit;font-size:13px;font-weight:500;border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);background:var(--raised);color:var(--text);
    padding:8px 14px;cursor:pointer;transition:background .15s ease,border-color .15s ease,opacity .15s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--raised-hover);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:transparent;}
  .btn-ghost:hover{background:var(--raised);}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#0d1b2a;font-weight:600;}
  .btn-primary:hover{background:#75AEEE;}
  .btn-small{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:default;}

  /* Layout */
  .layout{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;} .app{padding:0 20px 48px;}}
  @media (max-width:480px){.app{padding:0 16px 40px;}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.15), 0 4px 12px rgba(0,0,0,.12);
  }
  .card h2,.card h3{margin:0 0 16px;font-size:15px;font-weight:600;}

  .idea-row{display:flex;gap:8px;margin-bottom:16px;}
  .idea-row input{flex:1;}
  @media (max-width:520px){.idea-row{flex-direction:column;} .idea-row .btn{width:100%;}}

  input[type=text],input[type=number],textarea{
    width:100%;background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:10px 12px;font:inherit;font-size:14px;resize:vertical;
    transition:border-color .15s ease;
  }
  input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:none;border-color:var(--blue);}
  input::placeholder,textarea::placeholder{color:var(--text-tertiary);}

  .writer-backend{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .writer-backend > span{font-size:12px;color:var(--text-secondary);}

  .segmented{display:flex;gap:6px;background:var(--canvas);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .seg{flex:1;background:transparent;border:none;color:var(--text-secondary);padding:7px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .seg:hover{color:var(--text);}
  .seg.active{background:var(--blue-soft);color:var(--blue);font-weight:600;}

  .lang-toggle{width:100px;flex-shrink:0;}

  .segmented.wide{gap:8px;padding:0;background:none;border:none;flex-wrap:wrap;}
  .segmented.wide .seg{
    flex:1 1 140px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:var(--text-secondary);
  }
  .segmented.wide .seg .seg-title{font-size:13px;font-weight:600;color:var(--text);}
  .segmented.wide .seg .seg-sub{font-size:11px;color:var(--text-tertiary);}
  .segmented.wide .seg.active{border-color:var(--blue);background:var(--blue-soft);}
  .segmented.wide .seg.active .seg-title{color:var(--blue);}

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:7px;}
  .field label .hint{font-size:11px;font-weight:400;text-transform:none;color:var(--text-tertiary);}
  .field-row{display:flex;gap:16px;}
  .field-row .field{flex:1;}
  @media (max-width:520px){.field-row{flex-direction:column;gap:0;}}

  details.advanced{margin-top:6px;border-top:1px solid var(--border);padding-top:14px;}
  details.advanced summary{cursor:pointer;font-size:13px;color:var(--text-secondary);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px;}
  details.advanced summary::-webkit-details-marker{display:none;}
  details.advanced summary::before{content:"▸";font-size:11px;transition:transform .15s ease;}
  details.advanced[open] summary::before{transform:rotate(90deg);}
  .stage-sliders{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:600px){.stage-sliders{grid-template-columns:1fr;}}
  .slider-block{background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;}
  .slider-block .sb-title{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--text);}
  .slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .slider-row:last-child{margin-bottom:0;}
  .slider-row label{width:52px;font-size:11px;color:var(--text-tertiary);flex-shrink:0;}
  .slider-row input[type=range]{flex:1;accent-color:var(--blue);}
  .slider-row output{width:34px;text-align:right;font-size:11px;color:var(--text-secondary);flex-shrink:0;}

  .btn-run{
    width:100%;padding:14px;font-size:15px;font-weight:600;border-radius:var(--radius);
    background:var(--blue);color:#0d1b2a;border:1px solid var(--blue);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease,opacity .15s ease;
  }
  .btn-run:hover{background:#75AEEE;}
  .btn-run:disabled{opacity:.7;cursor:default;}

  /* Monitor panel */
  .cover-wrap{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1/1;background:var(--canvas);border:1px solid var(--border);}
  .cover-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(var(--cover-blur,16px)) saturate(1.05);transition:filter 1.1s ease;}
  .cover-caption{margin-top:10px;font-size:12px;color:var(--text-tertiary);text-align:center;}

  .stage{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .stage:last-child{border-bottom:none;}
  .stage-icon{width:24px;height:24px;border-radius:50%;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-tertiary);flex-shrink:0;font-weight:700;transition:background .2s ease,color .2s ease;}
  .stage.active .stage-icon{background:var(--blue-soft);color:var(--blue);}
  .stage.done .stage-icon{background:var(--green-soft);color:var(--green);}
  .stage-body{flex:1;min-width:0;}
  .stage-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;}
  .stage-name{font-size:13px;font-weight:600;}
  .stage-meta{font-size:11px;color:var(--text-tertiary);white-space:nowrap;}
  .stage-bar{height:5px;border-radius:3px;background:var(--raised);overflow:hidden;}
  .stage-bar-fill{height:100%;width:0%;background:var(--blue);border-radius:3px;transition:width .35s ease;}
  .stage.done .stage-bar-fill{background:var(--green);}

  .player-card{text-align:center;}
  .disc-area{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;height:150px;}
  .spectrum{display:flex;align-items:center;gap:3px;height:100%;flex:1;justify-content:flex-end;}
  .spectrum.right{justify-content:flex-start;}
  .spectrum span{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--orange));height:8%;transition:height .12s ease;}
  .disc{
    width:118px;height:118px;border-radius:50%;flex-shrink:0;position:relative;
    box-shadow:0 0 0 1px var(--border), 0 8px 20px rgba(0,0,0,.4);
    background:#111;overflow:hidden;
  }
  .disc img{width:100%;height:100%;object-fit:cover;display:block;}
  .disc::after{content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--canvas);border:2px solid rgba(255,255,255,.25);}
  .disc.spinning{animation:spin 6s linear infinite;}
  @media (prefers-reduced-motion:reduce){.disc.spinning{animation:none;}}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .track-title{font-size:16px;font-weight:600;margin-bottom:4px;}
  .track-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--raised);color:var(--text-secondary);}

  .transport{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .play-btn{width:40px;height:40px;border-radius:50%;background:var(--blue);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#0d1b2a;}
  .play-btn svg{width:14px;height:14px;}
  .seek{flex:1;display:flex;align-items:center;gap:8px;}
  .seek-bar{flex:1;height:5px;border-radius:3px;background:var(--raised);position:relative;overflow:hidden;cursor:pointer;}
  .seek-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:var(--blue);border-radius:3px;}
  .time{font-size:11px;color:var(--text-tertiary);width:36px;flex-shrink:0;}

  .artifacts-note{
    display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--text-tertiary);
    background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;flex-wrap:wrap;
  }
  .artifacts-note code{color:var(--text-secondary);font-family:Menlo,Consolas,monospace;font-size:11px;}

  .empty-hint{font-size:12px;color:var(--text-tertiary);text-align:center;padding:6px 0 2px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="white" stroke-width="1.8"/><circle cx="17" cy="16" r="3" stroke="white" stroke-width="1.8"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">YuE2 Console</span>
        <span class="brand-sub" data-i18n="brandSubtitle"></span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="vram">
        <span class="vram-label">GPU · RTX 4090</span>
        <div class="vram-bar"><div class="vram-fill" id="vramFill" style="width:59%"></div></div>
        <span class="vram-text" id="vramText">14.2 / 24 GB</span>
        <button class="btn btn-ghost btn-small" id="freeVramBtn" data-i18n="freeVram"></button>
      </div>
      <div class="segmented lang-toggle" data-group="lang">
        <button class="seg" data-value="en">EN</button>
        <button class="seg active" data-value="vi">VI</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- COMPOSE -->
    <section class="compose">

      <div class="card">
        <h2 data-i18n="ideaCardTitle"></h2>
        <div class="idea-row">
          <input type="text" id="ideaInput" data-i18n-placeholder="ideaPlaceholder" />
          <button class="btn btn-primary" id="ideaGenBtn" data-i18n="generate"></button>
        </div>
        <div class="writer-backend">
          <span data-i18n="writerBackendLabel"></span>
          <div class="segmented" data-group="backend" style="width:220px;">
            <button class="seg active" data-value="llamacpp">llama.cpp</button>
            <button class="seg" data-value="ollama">Ollama</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label data-i18n="titleLabel"></label>
          <input type="text" id="titleField" data-i18n-placeholder="titlePlaceholder" />
        </div>
        <div class="field">
          <label data-i18n="styleLabel"></label>
          <textarea id="styleField" rows="2" data-i18n-placeholder="stylePlaceholder"></textarea>
        </div>
        <div class="field">
          <label><span data-i18n="lyricsLabel"></span> <span class="hint" data-i18n="lyricsHint"></span></label>
          <textarea id="lyricsField" rows="9" placeholder="[Verse]
...

[Chorus]
..."></textarea>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label data-i18n="planningModeLabel"></label>
          <div class="segmented wide" data-group="cot">
            <button class="seg active" data-value="full"><span class="seg-title" data-i18n="fullPlanTitle"></span><span class="seg-sub" data-i18n="fullPlanSub"></span></button>
            <button class="seg" data-value="melody"><span class="seg-title" data-i18n="melodyTitle"></span><span class="seg-sub" data-i18n="melodySub"></span></button>
            <button class="seg" data-value="off"><span class="seg-title" data-i18n="directTitle"></span><span class="seg-sub" data-i18n="directSub"></span></button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label data-i18n="seedLabel"></label>
            <input type="number" id="seedField" value="-1" />
          </div>
          <div class="field">
            <label data-i18n="abcLabel"></label>
            <button class="btn btn-ghost" style="width:100%;" data-i18n="uploadScore"></button>
          </div>
        </div>
        <details class="advanced">
          <summary data-i18n="advancedSummary"></summary>
          <div class="stage-sliders">
            <div class="slider-block">
              <div class="sb-title" data-i18n="stageScore"></div>
              <div class="slider-row"><label>Temp</label><input type="range" min="0" max="100" value="70"/><output>0.70</output></div>
              <div class="slider-row"><label>Top-p</label><input type="range" min="0" max="100" value="90"/><output>0.90</output></div>
            </div>
            <div class="slider-block">
              <div class="sb-title" data-i18n="stageTokens"></div>
              <div class="slider-row"><label>Temp</label><input type="range" min="0" max="100" value="85"/><output>0.85</output></div>
              <div class="slider-row"><label>Top-p</label><input type="range" min="0" max="100" value="92"/><output>0.92</output></div>
            </div>
            <div class="slider-block">
              <div class="sb-title" data-i18n="stageSynth"></div>
              <div class="slider-row"><label>Temp</label><input type="range" min="0" max="100" value="60"/><output>0.60</output></div>
              <div class="slider-row"><label>Top-p</label><input type="range" min="0" max="100" value="88"/><output>0.88</output></div>
            </div>
            <div class="slider-block">
              <div class="sb-title" data-i18n="stageDecode"></div>
              <div class="slider-row"><label>Temp</label><input type="range" min="0" max="100" value="50"/><output>0.50</output></div>
              <div class="slider-row"><label>Top-p</label><input type="range" min="0" max="100" value="85"/><output>0.85</output></div>
            </div>
          </div>
        </details>
      </div>

      <button class="btn-run" id="runBtn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>
        <span id="runBtnLabel"></span>
      </button>

    </section>

    <!-- MONITOR -->
    <section class="monitor">

      <div class="card">
        <h3 data-i18n="coverTitle"></h3>

            <div class="seek-bar" id="seekBar"><div class="seek-fill" id="seekFill"></div></div>
            <span class="time" id="timeTotal">2:48</span>
          </div>
        </div>
        <div class="artifacts-note">
          <span>📁</span><span data-i18n="artifactsPrefix"></span> <code id="artifactPath">save_artifacts/2026-09-11_101922/</code>
        </div>
      </div>

      <div class="empty-hint" id="emptyHint"></div>

    </section>
  </div>
</div>

<script>
(function(){
  var translations = {
    en: {
      brandSubtitle: "Local song composer · runs on your GPU",
      freeVram: "Free VRAM",
      freeVramDone: "Freed ✓",
      ideaCardTitle: "Start from an idea",
      ideaPlaceholder: "e.g. a bittersweet synth-pop song about leaving your hometown",
      generate: "Generate",
      generating: "Writing…",
      writerBackendLabel: "WRITER BACKEND",
      titleLabel: "TITLE",
      titlePlaceholder: "Untitled Song",
      styleLabel: "STYLE PROMPT",
      stylePlaceholder: "synth-pop, warm analog synths, driving 80s drums, female vocals",
      lyricsLabel: "LYRICS",
      lyricsHint: "use [Verse] / [Chorus] tags",
      planningModeLabel: "PLANNING MODE",
      fullPlanTitle: "Full plan", fullPlanSub: "New songs",
      melodyTitle: "Melody only", melodySub: "Covers",
      directTitle: "Direct", directSub: "No score",
      seedLabel: "SEED",
      abcLabel: "ABC SCORE (OPTIONAL)",
      uploadScore: "Upload score…",
      advancedSummary: "Advanced: per-stage sampling",
      stageScore: "Score", stageTokens: "Music tokens", stageSynth: "Synthesis", stageDecode: "Decode",
      run: "Run", running: "Running…", runAgain: "Run again",
      coverTitle: "Cover art",
      coverCaption: "Drawn before the song — sharpens as stages complete",
      runProgressTitle: "Run progress",
      waiting: "waiting…",
      nowPlaying: "Now playing",
      artifactsPrefix: "Saved to",
      emptyHint: "Press <b>Run</b> to start composing.",
      tag1: "synth-pop", tag2: "80s drums", tag3: "female vocals",
      sampleTitle: "Leaving Hometown",
      sampleStyle: "synth-pop, warm analog synths, driving 80s drums, female vocals, nostalgic",
      sampleLyrics: "[Verse]\nNeon signs blur behind the window glass\nNothing left but the wind at 2 a.m.\nEvery small dream folds into my coat pocket\nCarrying the road, leaving the name of home\n\n[Chorus]\nLeaving my hometown, carrying the light\nKeeping the song I never forgot in my heart\nNo matter how far, no matter the sky's colour\nThere's still one place to turn back to",
      stageMetaProgress: function(tok, rate, eta){ return tok.toLocaleString() + " tok · " + rate + " tok/s · " + eta + "s left"; },
      stageMetaDone: function(tok){ return tok.toLocaleString() + " tok · done"; }
    },
    vi: {
      brandSubtitle: "Bộ soạn nhạc chạy trên GPU của bạn",
      freeVram: "Giải phóng VRAM",
      freeVramDone: "Đã giải phóng ✓",
      ideaCardTitle: "Bắt đầu từ một ý tưởng",
      ideaPlaceholder: "ví dụ: một bản synth-pop tiếc nuối về việc rời xa quê nhà",
      generate: "Tạo",
      generating: "Đang viết…",
      writerBackendLabel: "BACKEND VIẾT LỜI",
      titleLabel: "TIÊU ĐỀ",
      titlePlaceholder: "Bài hát chưa đặt tên",
      styleLabel: "MÔ TẢ PHONG CÁCH",
      stylePlaceholder: "synth-pop, synth ấm analog, trống 80s dồn dập, giọng nữ",
      lyricsLabel: "LỜI NHẠC",
      lyricsHint: "dùng thẻ [Verse] / [Chorus]",
      planningModeLabel: "CHẾ ĐỘ LẬP DÀN Ý",
      fullPlanTitle: "Full plan", fullPlanSub: "Bài hát mới",
      melodyTitle: "Melody only", melodySub: "Cover",
      directTitle: "Direct", directSub: "Không có score",
      seedLabel: "SEED",
      abcLabel: "ABC SCORE (TÙY CHỌN)",
      uploadScore: "Tải score…",
      advancedSummary: "Nâng cao: sampling theo từng giai đoạn",
      stageScore: "Score", stageTokens: "Nhạc token", stageSynth: "Tổng hợp", stageDecode: "Giải mã",
      run: "Chạy", running: "Đang chạy…", runAgain: "Chạy lại",
      coverTitle: "Ảnh bìa",
      coverCaption: "Được vẽ trước khi tạo nhạc — sắc nét dần khi các giai đoạn hoàn tất",
      runProgressTitle: "Tiến trình chạy",
      waiting: "chờ…",
      nowPlaying: "Đang phát",
      artifactsPrefix: "Đã lưu tại",
      emptyHint: "Nhấn <b>Run</b> để bắt đầu tạo bài hát.",
      tag1: "synth-pop", tag2: "trống 80s", tag3: "giọng nữ",
      sampleTitle: "Rời Xa Quê Nhà",
      sampleStyle: "synth-pop, synth ấm analog, trống 80s dồn dập, giọng nữ, hoài niệm",
      sampleLyrics: "[Verse]\nĐèn phố xa mờ sau lớp kính xe\nCòn lại gì đây ngoài tiếng gió khuya\nGiấc mơ nhỏ nằm im trong túi áo\nMang theo con đường, bỏ lại tên nhà\n\n[Chorus]\nRời xa quê hương, mang theo ánh đèn\nGiữ trong tim câu hát chưa từng quên\nDù đi bao xa, trời có đổi màu\nVẫn còn một chốn để quay đầu",
      stageMetaProgress: function(tok, rate, eta){ return tok.toLocaleString() + " tok · " + rate + " tok/s · còn " + eta + "s"; },
      stageMetaDone: function(tok){ return tok.toLocaleString() + " tok · hoàn tất"; }
    }
  };

  var currentLang = 'vi';
  var runState = 'idle'; // idle | running | done

  function t(key){ return translations[currentLang][key]; }

  function applyStaticTranslations(){
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      var val = t(key);
      if(val === undefined) return;
      if(key === 'emptyHint'){ el.innerHTML = val; }
      else { el.textContent = val; }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var key = el.getAttribute('data-i18n-placeholder');
      el.placeholder = t(key);
    });
    updateRunButtonLabel();
  }

  function updateRunButtonLabel(){
    var label = document.getElementById('runBtnLabel');
    if(runState === 'running') label.textContent = t('running');
    else if(runState === 'done') label.textContent = t('runAgain');
    else label.textContent = t('run');
  }

  function setLanguage(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    applyStaticTranslations();
  }

  // Segmented controls
  document.querySelectorAll('.segmented').forEach(function(group){
    group.addEventListener('click', function(e){
      var btn = e.target.closest('.seg');
      if(!btn) return;
      group.querySelectorAll('.seg').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if(group.getAttribute('data-group') === 'lang'){
        setLanguage(btn.getAttribute('data-value'));
      }
    });
  });

  // Sliders update readout
  document.querySelectorAll('.slider-row input[type=range]').forEach(function(inp){
    var out = inp.parentElement.querySelector('output');
    inp.addEventListener('input', function(){
      out.textContent = (inp.value/100).toFixed(2);
    });
  });

  // Free VRAM
  var vramFill = document.getElementById('vramFill');
  var vramText = document.getElementById('vramText');
  var freeBtn = document.getElementById('freeVramBtn');
  freeBtn.addEventListener('click', function(){
    vramFill.style.width = '4%';
    vramText.textContent = '0.9 / 24 GB';
    freeBtn.textContent = t('freeVramDone');
    setTimeout(function(){ freeBtn.textContent = t('freeVram'); }, 1600);
  });

  // Idea -> generate fields
  var ideaBtn = document.getElementById('ideaGenBtn');
  var titleField = document.getElementById('titleField');
  var styleField = document.getElementById('styleField');
  var lyricsField = document.getElementById('lyricsField');

  ideaBtn.addEventListener('click', function(){
    ideaBtn.disabled = true;
    var restoreLabel = t('generate');
    ideaBtn.textContent = t('generating');
    setTimeout(function(){
      titleField.value = t('sampleTitle');
      styleField.value = t('sampleStyle');
      lyricsField.value = t('sampleLyrics');
      ideaBtn.disabled = false;
      ideaBtn.textContent = restoreLabel;
    }, 900);
  });

  // Run pipeline simulation
  var runBtn = document.getElementById('runBtn');
  var stagesCard = document.getElementById('stagesCard');
  var playerCard = document.getElementById('playerCard');
  var emptyHint = document.getElementById('emptyHint');
  var coverImg = document.getElementById('coverImg');

  var stageDefs = [
    { key:'score', nameKey:'stageScore', totalTok:640, rate:42 },
    { key:'tokens', nameKey:'stageTokens', totalTok:3200, rate:96 },
    { key:'synth', nameKey:'stageSynth', totalTok:1800, rate:64 },
    { key:'decode', nameKey:'stageDecode', totalTok:900, rate:120 }
  ];

  function resetStages(){
    stageDefs.forEach(function(s){
      var el = document.querySelector('.stage[data-stage="'+s.key+'"]');
      el.classList.remove('active','done');
      el.querySelector('.stage-bar-fill').style.width = '0%';
      el.querySelector('[data-meta]').textContent = t('waiting');
    });
  }

  function runStage(idx, cb){
    var s = stageDefs[idx];
    var el = document.querySelector('.stage[data-stage="'+s.key+'"]');
    el.classList.add('active');
    var fill = el.querySelector('.stage-bar-fill');
    var meta = el.querySelector('[data-meta]');
    var progress = 0;
    var totalSteps = 20;
    var stepMs = 90;
    var overallBlur = 16 - (idx+1) * 4;
    var iv = setInterval(function(){
      progress++;
      var pct = Math.min(100, Math.round(progress/totalSteps*100));
      fill.style.width = pct + '%';
      var tok = Math.round(s.totalTok * pct/100);
      var eta = Math.max(0, Math.round((totalSteps - progress) * stepMs/1000));
      meta.textContent = t('stageMetaProgress')(tok, s.rate, eta);
      document.documentElement.style.setProperty('--cover-blur', Math.max(0, overallBlur * (1 - pct/100)) + 'px');
      if(progress >= totalSteps){
        clearInterval(iv);
        el.classList.remove('active');
        el.classList.add('done');
        meta.textContent = t('stageMetaDone')(tok);
        cb();
      }
    }, stepMs);
  }

  function runPipeline(){
    var i = 0;
    function next(){
      if(i >= stageDefs.length){
        finishRun();
        return;
      }
      runStage(i, function(){ i++; next(); });
    }
    next();
  }

  function finishRun(){
    runState = 'done';
    runBtn.disabled = false;
    updateRunButtonLabel();
    coverImg.style.setProperty('--cover-blur','0px');
    document.documentElement.style.setProperty('--cover-blur','0px');
    emptyHint.style.display = 'none';
    playerCard.style.display = 'block';
    var now = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    var pathStr = 'save_artifacts/' + now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds())+'/';
    document.getElementById('artifactPath').textContent = pathStr;
    document.getElementById('playerTitle').textContent = titleField.value || t('titlePlaceholder');
    startPlayback();
  }

  runBtn.addEventListener('click', function(){
    if(runState === 'running') return;
    runState = 'running';
    runBtn.disabled = true;
    updateRunButtonLabel();
    emptyHint.style.display = 'none';
    playerCard.style.display = 'none';
    stagesCard.style.display = 'block';
    resetStages();
    runPipeline();
  });

  // Spectrum bars
  var specLeft = document.getElementById('specLeft');
  var specRight = document.getElementById('specRight');
  for(var b=0;b<14;b++){
    var s1 = document.createElement('span'); specLeft.appendChild(s1);
    var s2 = document.createElement('span'); specRight.appendChild(s2);
  }
  var specInterval = null;
  var playing = false;
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animateSpectrum(){
    if(reducedMotion) return;
    document.querySelectorAll('.spectrum span').forEach(function(el){
      el.style.height = playing ? (8 + Math.random()*85) + '%' : '8%';
    });
  }

  var playPauseBtn = document.getElementById('playPauseBtn');
  var playIcon = document.getElementById('playIcon');
  var disc = document.getElementById('disc');
  var seekFill = document.getElementById('seekFill');
  var timeCur = document.getElementById('timeCur');
  var totalSeconds = 168; // 2:48
  var curSeconds = 0;
  var seekInterval = null;

  function fmt(sec){
    var m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function startPlayback(){
    playing = true;
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    disc.classList.add('spinning');
    if(!reducedMotion){ specInterval = setInterval(animateSpectrum, 130); }
    seekInterval = setInterval(function(){
      curSeconds += 1;
      if(curSeconds >= totalSeconds){ curSeconds = totalSeconds; togglePlay(false); }
      seekFill.style.width = (curSeconds/totalSeconds*100) + '%';
      timeCur.textContent = fmt(curSeconds);
    }, 1000);
  }

  function togglePlay(forceState){
    playing = (typeof forceState === 'boolean') ? forceState : !playing;
    if(playing){
      playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      disc.classList.add('spinning');
      if(!reducedMotion && !specInterval){ specInterval = setInterval(animateSpectrum, 130); }
      if(!seekInterval){
        seekInterval = setInterval(function(){
          curSeconds += 1;
          if(curSeconds >= totalSeconds){ curSeconds = totalSeconds; togglePlay(false); }
          seekFill.style.width = (curSeconds/totalSeconds*100) + '%';
          timeCur.textContent = fmt(curSeconds);
        }, 1000);
      }
    } else {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      disc.classList.remove('spinning');
      if(specInterval){ clearInterval(specInterval); specInterval = null; animateSpectrum(); }
      if(seekInterval){ clearInterval(seekInterval); seekInterval = null; }
    }
  }

  playPauseBtn.addEventListener('click', function(){ togglePlay(); });

  document.getElementById('seekBar').addEventListener('click', function(e){
    var rect = this.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    curSeconds = Math.max(0, Math.min(totalSeconds, Math.round(pct * totalSeconds)));
    seekFill.style.width = (curSeconds/totalSeconds*100) + '%';
    timeCur.textContent = fmt(curSeconds);
  });

  document.getElementById('timeTotal').textContent = fmt(totalSeconds);

  applyStaticTranslations();
})();
</script>
</body>
